<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <title>Expense Tracker</title>
    <style>
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Poppins", sans-serif;
      }
    </style>
  </head>
  <body>
    <h1>Expense Tracker</h1>
    <form action="/add" method="post">
      <input type="text" placeholder="Type Amount" name="amount" />

      <br />
      <input
        type="radio"
        name="transaction_type"
        id="expense"
        value="expense"
        checked
      />
      <label for="expense">Expense</label>

      <input type="radio" name="transaction_type" id="income" value="income" />
      <label for="income">Income</label>

      <br />
      <label for="category">Choose category:</label>
      <select id="category" name="transaction_category">
        <option value="food" selected>Food</option>
        <option value="entertainment">Entertainment</option>
        <option value="travel">Travel</option>
        <option value="other">Other</option>
      </select>

      <br />
      <label for="description">Add Description:</label>
      <input type="text" name="description" id="description" />

      <br />
      <input type="radio" name="payment_method" id="upi" value="upi" checked />
      <label for="upi">upi</label>

      <input type="radio" name="payment_method" id="cash" value="cash" />
      <label for="cash">cash</label>

      <input type="radio" name="payment_method" id="card" value="card" />
      <label for="card">card</label>

      <br />
      <button type="submit">Add</button>
    </form>

    <h2>Recent Transactions</h2>
    <table
      border="1"
      cellpadding="8"
      style="width: 100%; border-collapse: collapse"
    >
      <thead>
        <tr>
          <th>Date</th>
          <th>Time</th>
          <th>Amount</th>
          <th>Type</th>
          <th>Category</th>
          <th>Payment</th>
          <th>Description</th>
        </tr>
      </thead>
      <tbody>
        {% for t in transactions %}
        <tr>
          <td>{{ t[1] }}</td>
          <td>{{ t[2] }}</td>
          <td>₹{{ t[3] }}</td>
          <td>{{ t[7] }}</td>
          <td>{{ t[4] }}</td>
          <td>{{ t[6] }}</td>
          <td>{{ t[5] }}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </body>
</html>
